name: Deploy saferide to GitHub Pages

on:
  push:
    branches: [kir]

permissions:
  contents: read

concurrency:
  group: saferide-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out saferide
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build the web app
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SAFERIDE_API_URL: ${{ vars.SAFERIDE_API_URL || vars.SCOOT_API_URL || 'https://scoot-api-production.up.railway.app' }}
        shell: bash
        run: |
          auth_flags=(--dart-define=SAFERIDE_AUTH_ENABLED=false)
          if [[ -n "$SAFERIDE_API_URL" ]]; then
            if [[ "$SAFERIDE_API_URL" != https://?* ]]; then
              printf '%s\n' 'SAFERIDE_API_URL must be an HTTPS URL.' >&2
              exit 1
            fi
            auth_flags=("--dart-define=SAFERIDE_API_URL=$SAFERIDE_API_URL")
          fi
          flutter build web --no-pub --no-web-resources-cdn \
            --web-content-hash --base-href "${PAGES_BASE_PATH%/}/" "${auth_flags[@]}"

      - name: Upload the web build
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the web build
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
